# babe basket pipeline settings. Secrets (API keys, bot token) go in .env, never here.

# What the shop sells. Customers: Vietnamese girls/young women (high school to ~35).
# Each group lists the dm categories to scrape (exact names from dm.de's category filter) and
# how many drafts per day it gets. babebasket/catalog.py then drops what is never sold
# (aerosols / flammable, accessories, electrical, perfume except Jean & Len hair perfume,
# non-beauty supplements) and sorts Rossmann products into the same groups by name.
[groups.hair]
per_day = 5
dm = ["Shampoo", "Conditioner", "Haarkur & Haarmaske", "Leave-In", "Haaröl", "Haarstyling"]

[groups.body]
per_day = 3
dm = ["Bodylotion & Hautcreme", "Körperöl", "Deo", "Handcreme & Handmasken", "Fußpflege",
      "Duschgel", "Körperpeeling & Body Scrub", "Badezusatz & Badesalz", "Intimpflege & -gesundheit"]

[groups.extra]
# Sun care, skincare, beauty supplements, gift sets, men's products: only very well rated ones.
per_day = 2
min_rating = 4.5
min_reviews = 100
dm = ["Sonnenpflege", "Gesichtspflege", "Hautbild", "Wohlbefinden & Stärkung", "Abnehmprodukte",
      "Geschenksets", "Pflegeprodukte für Männer"]

[rossmann]
# Category page URLs on rossmann.de (no query string). Fill in after running the probe:
#   python3 -m babebasket.stores.rossmann probe
categories = [
"https://www.rossmann.de/de/alle-marken/isana/c/online-dachmarke_4455382",
]
# Public offers pages (found with probe-offers): discounted products rank higher for 7 days,
# "Neu" products feed the daily new-product pick. Cookies/food/detergent are filtered out as usual.
offer_pages = [
"https://www.rossmann.de/de/angebote/m/angebote",
"https://www.rossmann.de/de/angebote/m/neu-im-sortiment",
]


[shortlist]
per_day = 10             # posts drafted per day (the [groups] quotas add up to this)
min_rating = 4.0         # hair and body: 3.9★ and below is never sold; [groups.extra] is stricter
min_reviews = 10         # few reviews rank lower anyway (score weighs the number of reviews)
coupon_weight = 2.0      # a valid coupon for a product/brand boosts it: 20 % -> score x1.4 (see #coupons)
new_per_day = 1          # "gacha" pick: a new product with no rating yet, from a brand whose
                         # other products average 4.4★ or more; the card marks it 🆕
sweet_spot_eur = 10      # students' budget: dearer products rank lower
max_price_eur = 20       # above this a product is skipped ...
max_price_gift_set_eur = 40   # ... except gift sets
repeat_after_days = 45   # don't redraft a product sooner than this
# Brands the shop already sells get a small boost.
preferred_brands = ["Balea", "Garnier", "L'ORÉAL", "Elvital", "NIVEA", "Dove", "Doppelherz", "ISANA", "Jean&Len", "Tesori d'Oriente", "KIKO"]

[pricing]
# Simple placeholder rule; edit later.
# sale price (VND) = (shelf price x (1 - coupon) x vnd_per_eur + shipping_vnd_per_item) x (1 + markup)
vnd_per_eur = 30000
shipping_vnd_per_item = 0
markup = 0.35
round_to_thousand = 5    # round the 🐠 price up to a multiple of this

[coupons]
# Standing coupon assumed per store, in percent.
dm = 0
rossmann = 10

[llm]
# Any OpenRouter model id. Pick one with good Vietnamese.
model = "google/gemini-3.8-flash"
temperature = 0.8

[discord]
channel_id = "1572004160923115541"          # the approval channel (right-click channel -> Copy Channel ID)
owner_user_ids = []      # empty = every member of the server can approve (any non-bot user); or list user IDs to limit it

[threads]
# Post approved drafts (✅ + caption number on Discord) to the Threads account of THREADS_ACCESS_TOKEN.
# The token is renewed automatically every 7 days; a new token pasted into .env always wins.
enabled = true

[image]
# Gemini image model on OpenRouter that puts the packshot in a hand in a drugstore aisle.
# Switch to "google/gemini-3-pro-image" for higher quality (costs more). enabled = false -> plain background.
model = "google/gemini-3.1-flash-image"
enabled = true
# AI images are made only after the caption is approved (about $0.08 each).
max_per_day = 10         # paid image requests per day; after that the plain background is used
max_per_post = 3         # first image + two ✏️ edits
